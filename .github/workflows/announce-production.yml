name: GuildNest Official Changelog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose the initial full history or a normal incremental update"
        required: true
        type: choice
        options:
          - backfill
          - incremental
        default: incremental
  deployment_status:

permissions:
  contents: write
  workflows: write

concurrency:
  group: guildnest-discord-changelog
  cancel-in-progress: false

jobs:
  changelog:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Identify production deployment
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          environment="${DEPLOYMENT_ENVIRONMENT,,}"
          if [[ "$environment" != *production* && "$environment" != *guildnest-nestmate-6c3b* ]]; then
            echo "Not a GuildNest production deployment; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sha=$DEPLOYMENT_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=incremental" >> "$GITHUB_OUTPUT"

      - name: Check out complete commit history
        if: steps.target.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish changelog to GuildNest #updates
        if: steps.target.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
          CHANGELOG_ROLE_ID: "1565169230549090384"
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          MODE: ${{ steps.target.outputs.mode }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK" ]]; then
            echo "::error::Missing DISCORD_UPDATES_WEBHOOK_URL repository secret."
            exit 1
          fi

          git fetch origin main --tags
          marker="discord-changelog-last"
          if [[ "$MODE" == "backfill" || ! -f .git/refs/tags/$marker && -z "$(git tag -l "$marker")" ]]; then
            range="$TARGET_SHA"
            mode_label="Complete commit history"
          else
            last_sha="$(git rev-parse "$marker^{commit}")"
            if [[ "$last_sha" == "$TARGET_SHA" ]]; then
              echo "This deployment has already been announced."
              exit 0
            fi
            range="$last_sha..$TARGET_SHA"
            mode_label="New changes"
          fi

          git log --reverse --date=short --format='%H%x1f%cs%x1f%s' "$range" > /tmp/changelog.txt
          if [[ ! -s /tmp/changelog.txt ]]; then
            echo "No new commits to announce."
            exit 0
          fi

          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          webhook = os.environ["DISCORD_WEBHOOK"]
          role_id = os.environ.get("CHANGELOG_ROLE_ID", "").strip()
          mode_label = "Complete commit history" if os.environ["MODE"] == "backfill" else "New changes"
          repository = os.environ["GITHUB_REPOSITORY"]
          lines = open("/tmp/changelog.txt", encoding="utf-8").read().splitlines()
          categories = [
              ("Website & Dashboard", ("dashboard", "website", "web ", "web:", "oauth", "landing page", "module card", "sidebar")),
              ("NestMate & Discord", ("bot", "nestmate", "discord", "ticket", "slash command", "server setup", "staff center", "gateway")),
              ("Infrastructure & Deployments", ("deploy", "deployment", "render", "vercel", "cloudflare", "worker", "ci ", "workflow", "github actions", "health endpoint")),
              ("Documentation & Maintenance", ("document", "readme", "gitignore", "typecheck", "typescript", "lint", "config", "diagnostic", "fix syntax", "format")),
          ]
          grouped = {name: [] for name, _ in categories}
          grouped["Other improvements"] = []
          for line in lines:
              parts = line.split("\x1f", 2)
              if len(parts) != 3:
                  continue
              sha, date, subject = parts
              lower = subject.lower()
              category = next((name for name, terms in categories if any(term in lower for term in terms)), "Other improvements")
              safe_subject = subject.replace("@", "@\u200b")
              grouped[category].append(
                  f"• **{date}** — {safe_subject} ([{sha[:7]}](https://github.com/{repository}/commit/{sha}))"
              )
          total_entries = sum(len(items) for items in grouped.values())
          fields = []
          for category, _ in categories:
              items = grouped[category]
              if not items:
                  continue
              value = ""
              part_number = 1
              for item in items:
                  candidate = (value + "\n\n" if value else "") + item
                  if len(candidate) > 1024:
                      fields.append({"name": category if part_number == 1 else f"{category} (continued)", "value": value, "inline": False})
                      part_number += 1
                      value = item
                  else:
                      value = candidate
              if value:
                  fields.append({"name": category if part_number == 1 else f"{category} (continued)", "value": value, "inline": False})
          items = grouped["Other improvements"]
          if items:
              value = ""
              part_number = 1
              for item in items:
                  candidate = (value + "\n" if value else "") + item
                  if len(candidate) > 1024:
                      fields.append({"name": "Other improvements" if part_number == 1 else "Other improvements (continued)", "value": value, "inline": False})
                      part_number += 1
                      value = item
                  else:
                      value = candidate
              if value:
                  fields.append({"name": "Other improvements" if part_number == 1 else "Other improvements (continued)", "value": value, "inline": False})

          # Discord permits at most 6,000 combined characters across an embed.
          embed_chars = len("GUILDNEST — OFFICIAL CHANGELOG") + len(mode_label) + sum(len(f["name"]) + len(f["value"]) for f in fields)
          if len(fields) > 25 or embed_chars > 5800:
              counts = [f"**{name}:** {len(items)}" for name, items in grouped.items() if items]
              fields = [{
                  "name": "Release summary",
                  "value": f"**{total_entries} commits** across {len([x for x in grouped.values() if x])} project areas.\n" + "\n".join(counts) + f"\n\n[View all commits](https://github.com/{repository}/commits/main)",
                  "inline": False
              }]

          embed = {
              "title": "🏆 GUILDNEST — OFFICIAL CHANGELOG",
              "description": f"**{mode_label}** · {total_entries} commit(s)",
              "color": 0xD4AF37,
              "fields": fields,
              "footer": {"text": "GuildNest • Automatically published after production updates"}
          }
          payload = {
              "username": "GuildNest Changelog",
              "content": f"<@&{role_id}>" if role_id else "",
              "embeds": [embed],
              "allowed_mentions": {"parse": [], "roles": [role_id] if role_id else []}
          }
          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GuildNestChangelog/1.0 (+https://github.com/dospatch/guildnest)"
              },
              method="POST"
          )
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status not in (200, 204):
                          raise RuntimeError(f"Discord returned HTTP {response.status}")
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code == 429 and attempt < 4:
                      try:
                          delay = float(json.loads(exc.read().decode()).get("retry_after", 2))
                      except Exception:
                          delay = 2
                      time.sleep(delay + 0.5)
                      continue
                  detail = exc.read().decode("utf-8", errors="replace")[:1500]
                  raise RuntimeError(f"Discord webhook rejected the message (HTTP {exc.code}): {detail or exc.reason}") from exc
          print(f"Published one embedded changelog post for {total_entries} commits.")
          PY

          git tag -f discord-changelog-last "$TARGET_SHA"
          git push origin "refs/tags/discord-changelog-last" --force
