name: Register GuildNest Discord Commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Register Discord slash commands
        working-directory: apps/worker
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: "1564849911114240081"
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "::error::Add DISCORD_BOT_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi
          node scripts/register-commands.mjs
