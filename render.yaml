services:
  - type: web
    name: guildnest-nestmate
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm run register:commands && npm run start:bot
    healthCheckPath: /health
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
